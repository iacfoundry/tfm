# --------------------------------------------------------------------------------
# Workflow Name: Terraform Module Testing
# Contributor(s): William Robinson
# Created: February 2026
# Updated: May 2026
# Purpose: Run terraform tests on modules in the repository
# --------------------------------------------------------------------------------

name: Terraform Module Testing

on:
  push:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      developer:
        description: "Developer pattern (e.g., hashicorp or *)"
        required: false
        type: string
        default: "*"
      provider:
        description: "Provider pattern (e.g., azurerm or *)"
        required: false
        type: string
        default: "*"
      resource:
        description: "Resource pattern(s), comma-separated (e.g.,
          resource_group,storage_account or *)"
        required: false
        type: string
        default: "*"
      troubleshoot:
        description: "Troubleshoot the workflow"
        required: false
        type: boolean
        default: false

jobs:
  terraform_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: modules

      - name: Copy Provider Level TF Files
        run: |
          find modules -maxdepth 3 -name "*.tf" -exec cp -v {} . \;

          if [ -d "modules/tests" ]; then
            cp -r modules/tests ./tests
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive -no-color

      - name: Terraform Init
        run: terraform init -backend=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Test
        env:
          TROUBLESHOOT: ${{ inputs.troubleshoot || 'false' }}
          DEV_INPUT: ${{ inputs.developer || '*' }}
          PROV_INPUT: ${{ inputs.provider || '*' }}
          RES_INPUT: ${{ inputs.resource || '*' }}
        run: |
          set -u
          shopt -s nullglob

          TFVARS_FILES=()

          # Initialize temporary files for summary components
          TABLE_ROWS_FILE=$(mktemp)
          DETAILS_FILE=$(mktemp)

          add_tfvars_file() {
            local tfvars_file="$1"

            if [[ -f "$tfvars_file" ]]; then
              TFVARS_FILES+=("$tfvars_file")
            fi
          }

          add_all_tfvars() {
            while IFS= read -r tfvars_file; do
              add_tfvars_file "$tfvars_file"
            done < <(find modules -path "*/examples.tfvars" -type f | sort)
          }

          add_provider_tfvars() {
            local developer="$1"
            local provider="$2"

            while IFS= read -r tfvars_file; do
              add_tfvars_file "$tfvars_file"
            done < <(find "modules/${developer}/${provider}" -mindepth 2 -maxdepth 2 -name "examples.tfvars" -type f 2>/dev/null | sort)
          }

          dedupe_tfvars_files() {
            if [ ${#TFVARS_FILES[@]} -eq 0 ]; then
              return
            fi

            mapfile -t TFVARS_FILES < <(printf "%s\n" "${TFVARS_FILES[@]}" | sort -u)
          }

          run_terraform_test() {
            local test_target="$1"
            local test_log="$2"
            local test_exit_code=0

            echo "--------------------------------------------------------"
            echo "Running: ${test_target}"
            echo "--------------------------------------------------------"

            if [ "${TROUBLESHOOT}" = "true" ]; then
              echo "Working directory:"
              pwd

              echo ""
              echo "Root files:"
              ls -la

              echo ""
              echo "Modules directory:"
              ls -la modules || true

              echo ""
              echo "Tests directory:"
              ls -la tests || true
            fi

            set +e

            if [ "$test_target" = "terraform test" ]; then
              terraform test -no-color -verbose 2>&1 | tee "$test_log"
              test_exit_code=${PIPESTATUS[0]}
            else
              terraform test -no-color -verbose -var-file="$test_target" 2>&1 | tee "$test_log"
              test_exit_code=${PIPESTATUS[0]}
            fi

            set -e

            if [ "$test_exit_code" -eq 0 ]; then
              echo "| \`${test_target}\` | ✅ Passed |" >> "$TABLE_ROWS_FILE"
            else
              echo "| \`${test_target}\` | ❌ Failed |" >> "$TABLE_ROWS_FILE"
            fi

            {
              echo ""
              echo "<details>"
              echo "<summary><strong>Output: ${test_target}</strong></summary>"
              echo ""
              echo '```text'
              tail -n 200 "$test_log"
              echo '```'
              echo "</details>"
            } >> "$DETAILS_FILE"

            return "$test_exit_code"
          }

          echo "GitHub event name: ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual workflow run detected."
            echo "Using selected patterns: ${DEV_INPUT}/${PROV_INPUT}/${RES_INPUT}"
            echo "Manual matching is case-insensitive."

            DEV_INPUT_CLEAN="$(echo "${DEV_INPUT// /}" | tr '[:upper:]' '[:lower:]')"
            PROV_INPUT_CLEAN="$(echo "${PROV_INPUT// /}" | tr '[:upper:]' '[:lower:]')"
            RES_INPUT_CLEAN="$(echo "${RES_INPUT// /}" | tr '[:upper:]' '[:lower:]')"

            IFS=',' read -ra RES_ARRAY <<< "$RES_INPUT_CLEAN"

            while IFS= read -r tfvars_file; do
              # Expected:
              # modules/developer/provider/resource/examples.tfvars

              REL_PATH="${tfvars_file#modules/}"

              DEVELOPER_ACTUAL="$(echo "$REL_PATH" | cut -d'/' -f1)"
              PROVIDER_ACTUAL="$(echo "$REL_PATH" | cut -d'/' -f2)"
              RESOURCE_ACTUAL="$(echo "$REL_PATH" | cut -d'/' -f3)"

              DEVELOPER_LOWER="$(echo "$DEVELOPER_ACTUAL" | tr '[:upper:]' '[:lower:]')"
              PROVIDER_LOWER="$(echo "$PROVIDER_ACTUAL" | tr '[:upper:]' '[:lower:]')"
              RESOURCE_LOWER="$(echo "$RESOURCE_ACTUAL" | tr '[:upper:]' '[:lower:]')"

              if [[ "$DEV_INPUT_CLEAN" != "*" && "$DEV_INPUT_CLEAN" != "$DEVELOPER_LOWER" ]]; then
                continue
              fi

              if [[ "$PROV_INPUT_CLEAN" != "*" && "$PROV_INPUT_CLEAN" != "$PROVIDER_LOWER" ]]; then
                continue
              fi

              RESOURCE_MATCH=false

              for RES in "${RES_ARRAY[@]}"; do
                if [[ "$RES" == "*" || "$RES" == "$RESOURCE_LOWER" ]]; then
                  RESOURCE_MATCH=true
                  break
                fi
              done

              if [ "$RESOURCE_MATCH" = "true" ]; then
                add_tfvars_file "$tfvars_file"
              fi

            done < <(find modules -path "*/examples.tfvars" -type f | sort)

          else
            echo "Push event detected."
            echo "Finding changed files and mapping them to module resource folders."

            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              MODIFIED_FILES=$(git -C modules diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
            else
              MODIFIED_FILES=$(git -C modules diff-tree --no-commit-id --name-only -r "$CURRENT_SHA")
            fi

            echo "Modified files:"
            echo "$MODIFIED_FILES"

            if [[ -z "$MODIFIED_FILES" ]]; then
              echo "No modified files detected from git diff."
            fi

            while IFS= read -r FILE; do
              if [[ -z "$FILE" ]]; then
                continue
              fi

              # If shared tests changed, run all examples.
              if [[ "$FILE" == tests/* ]]; then
                echo "Shared test file changed: $FILE"
                echo "Adding all examples.tfvars files."
                add_all_tfvars
                continue
              fi

              IFS='/' read -ra PARTS <<< "$FILE"

              # Expected resource module path:
              # developer/provider/resource/file
              #
              # Example:
              # hashicorp/azurerm/resource_group/variables.tf
              if [ "${#PARTS[@]}" -ge 4 ]; then
                DEVELOPER="${PARTS[0]}"
                PROVIDER="${PARTS[1]}"
                RESOURCE="${PARTS[2]}"
                RESOURCE_DIR="modules/${DEVELOPER}/${PROVIDER}/${RESOURCE}"

                if [[ -f "${RESOURCE_DIR}/examples.tfvars" ]]; then
                  echo "Changed resource module detected: ${RESOURCE_DIR}"
                  add_tfvars_file "${RESOURCE_DIR}/examples.tfvars"
                else
                  echo "Changed file is under a folder without examples.tfvars: ${RESOURCE_DIR}"
                fi

                continue
              fi

              # Expected provider-level path:
              # developer/provider/file
              #
              # Example:
              # hashicorp/azurerm/variables.tf
              #
              # If provider-level files change, test all resources for that provider.
              if [ "${#PARTS[@]}" -eq 3 ]; then
                DEVELOPER="${PARTS[0]}"
                PROVIDER="${PARTS[1]}"

                echo "Provider-level file changed: $FILE"
                echo "Adding all examples.tfvars under modules/${DEVELOPER}/${PROVIDER}"
                add_provider_tfvars "$DEVELOPER" "$PROVIDER"

                continue
              fi

              # Anything else is too broad to map safely.
              # Run all examples so shared/root-level changes still get tested.
              echo "Broad or unmapped change detected: $FILE"
              echo "Adding all examples.tfvars files."
              add_all_tfvars

            done <<< "$MODIFIED_FILES"
          fi

          dedupe_tfvars_files

          echo ""
          echo "Selected examples.tfvars files:"
          if [ ${#TFVARS_FILES[@]} -eq 0 ]; then
            echo "None"
          else
            printf '%s\n' "${TFVARS_FILES[@]}"
          fi

          EXIT_CODE=0

          if [ ${#TFVARS_FILES[@]} -eq 0 ]; then
            TEST_LOG="terraform-test-default.log"

            run_terraform_test "terraform test" "$TEST_LOG" || EXIT_CODE=$?
          else
            for tfvars_file in "${TFVARS_FILES[@]}"; do
              SAFE_NAME=$(echo "$tfvars_file" | sed 's#[/ ]#_#g')
              TEST_LOG="terraform-test-${SAFE_NAME}.log"

              run_terraform_test "$tfvars_file" "$TEST_LOG" || EXIT_CODE=$?
            done
          fi

          # --------------------------------------------------------
          # Assemble GitHub Step Summary
          # --------------------------------------------------------
          {
            echo "# Terraform Test Results"
            echo ""
            echo "| Test Target | Result |"
            echo "|---|---|"
            cat "$TABLE_ROWS_FILE"
            echo ""
            echo "## Selected Test Inputs"
            echo ""
            if [ ${#TFVARS_FILES[@]} -eq 0 ]; then
              echo "No examples.tfvars files were selected. Ran default test."
            else
              echo '```text'
              printf '%s\n' "${TFVARS_FILES[@]}"
              echo '```'
            fi
            echo ""
            cat "$DETAILS_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

          # Cleanup
          rm -f "$TABLE_ROWS_FILE" "$DETAILS_FILE"

          exit "$EXIT_CODE"